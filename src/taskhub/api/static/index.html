<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>TaskHub</title>
<style>
  :root { color-scheme: dark; }
  body { margin:0; font:14px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace; background:#0d1117; color:#c9d1d9; }
  header { display:flex; align-items:center; gap:12px; padding:12px 20px; border-bottom:1px solid #21262d; }
  h1 { font-size:16px; margin:0; }
  main { display:grid; grid-template-columns:280px 1fr; min-height:calc(100vh - 49px); }
  aside { border-right:1px solid #21262d; padding:12px; overflow:auto; }
  section { padding:16px 20px; overflow:auto; }
  button { background:#21262d; color:#c9d1d9; border:1px solid #30363d; border-radius:6px; padding:4px 10px; cursor:pointer; font:inherit; }
  button:hover { background:#30363d; }
  select, input { background:#0d1117; color:#c9d1d9; border:1px solid #30363d; border-radius:6px; padding:4px 8px; font:inherit; }
  .proj { padding:8px; border-radius:6px; cursor:pointer; }
  .proj:hover, .proj.active { background:#161b22; }
  .muted { color:#8b949e; }
  .pill { display:inline-block; padding:1px 8px; border-radius:999px; background:#161b22; border:1px solid #30363d; margin:2px; font-size:12px; }
  table { border-collapse:collapse; width:100%; }
  th, td { text-align:left; padding:6px 8px; border-bottom:1px solid #21262d; }
  th { color:#8b949e; font-weight:600; }
  h2 { font-size:14px; margin:20px 0 8px; color:#58a6ff; }
  code { color:#79c0ff; }
  .bad { color:#f85149; }
  .cost { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:8px; margin:8px 0; }
  .cost .kpi { background:#161b22; border:1px solid #30363d; border-radius:6px; padding:8px 10px; }
  .cost .kpi .label { color:#8b949e; font-size:11px; text-transform:uppercase; letter-spacing:.04em; }
  .cost .kpi .value { font-size:16px; margin-top:2px; }
  .cost .kpi .value.good { color:#3fb950; }
  .cost .kpi .value.warn { color:#d29922; }
  .burn { display:flex; align-items:flex-end; gap:2px; height:60px; margin:8px 0; }
  .burn .bar { background:#58a6ff; border-radius:2px 2px 0 0; min-height:2px; flex:1 1 auto; }
  .burn .bar.empty { background:#21262d; }
  .hint { color:#d29922; font-size:12px; margin:6px 0; }
</style>
</head>
<body>
<header>
  <h1>TaskHub</h1>
  <span class="muted" id="status">loading…</span>
  <button onclick="refresh()">Refresh</button>
</header>
<main>
  <aside>
  <input id="filter" placeholder="filter projects…" oninput="renderProjects(this.value)" style="width:100%;box-sizing:border-box;margin-bottom:8px" />
  <div id="projects"></div>
</aside>
  <section id="detail"><p class="muted">Select a project.</p></section>
</main>
<script>
const $ = (id) => document.getElementById(id);
// Values below come from the database (model names, project titles), so
// they are escaped before they reach innerHTML.
const esc = (value) => String(value ?? "").replace(/[&<>"']/g, (ch) => ({
  "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
}[ch]));
const money = (value) => {
  if (value === null || value === undefined) return "—";
  const num = Number(value);
  if (!Number.isFinite(num)) return "—";
  return num < 0.01 && num > 0 ? `$${num.toFixed(4)}` : `$${num.toFixed(2)}`;
};
const num = (value) => {
  if (value === null || value === undefined) return "—";
  return Number(value).toLocaleString("en-US");
};
const STATUSES = ["", "backlog", "ready", "in_progress", "blocked", "review", "done", "cancelled", "archived"];
let allProjects = [];
let current = null;
let currentStatus = "";

async function api(path) {
  const res = await fetch(path);
  if (!res.ok) throw new Error(`${res.status} ${await res.text()}`);
  return res.json();
}

function renderProjects(filter = "") {
  const needle = filter.trim().toLowerCase();
  const visible = allProjects.filter(p =>
    !needle || p.slug.toLowerCase().includes(needle) || (p.name || "").toLowerCase().includes(needle));
  $("projects").innerHTML = visible.map(p =>
    `<div class="proj ${p.slug === current ? "active" : ""}" onclick="selectProject('${p.slug}')">
       <div><code>${p.slug}</code></div>
       <div class="muted">${Object.entries(p.by_status).map(([k, v]) => `${k}:${v}`).join(" ")}</div>
     </div>`).join("") || '<p class="muted">No projects.</p>';
}

async function refresh() {
  try {
    allProjects = await api("/api/projects");
    $("status").textContent = `${allProjects.length} projects`;
    renderProjects($("filter") ? $("filter").value : "");
    if (current) await loadDetail();
  } catch (e) { $("status").textContent = "error: " + e.message; }
}

function renderCost(summary, series, rows) {
  const money_ = summary ? summary.total_cost_usd : null;
  const baseline = summary ? summary.baseline_human_cost_usd : null;
  const savings = summary ? summary.savings_usd : null;
  const rate = summary ? summary.human_rate_usd_per_hour : null;
  const roi = summary ? summary.roi : null;
  const unpriced = (summary && summary.unpriced_models) || [];

  const kpi = (label, value, cls = "") =>
    `<div class="kpi"><div class="label">${esc(label)}</div><div class="value ${cls}">${value}</div></div>`;

  const kpis = [
    kpi("total cost", money(money_)),
    kpi("human rate", rate ? `${money(rate)}/h` : "—"),
    kpi("human baseline", money(baseline)),
    kpi("savings", money(savings), savings > 0 ? "good" : ""),
    kpi("roi", roi === null || roi === undefined ? "—" : `${Math.round(roi * 100)}%`,
        roi > 0 ? "good" : "warn"),
  ].join("");

  let hint = "";
  if (unpriced.length) {
    hint = `<p class="hint">Unpriced models (cost not counted): ${unpriced.map(esc).join(", ")}. Set a price to make the total trustworthy.</p>`;
  } else if (!rows || !rows.length) {
    hint = `<p class="hint">No agent usage recorded yet. Prices are not configured — run <code>taskhub prices sync --no-dry-run</code>.</p>`;
  }

  const table = (rows || []).length ? `
      <table><tr><th>model</th><th>tokens</th><th>token cost</th><th>reported</th><th>sessions</th></tr>
      ${rows.map(r => `<tr>
        <td>${esc(r.key)}${r.unpriced ? ' <span class="pill">unpriced</span>' : ""}</td>
        <td>${num(r.total_tokens)}</td>
        <td>${money(r.token_cost_usd)}</td>
        <td>${money(r.reported_cost_usd)}</td>
        <td>${num(r.sessions)}</td>
      </tr>`).join("")}</table>` : "";

  const points = (series && series.points) || [];
  const max = Math.max(...points.map(p => Number(p.total_cost_usd) || 0), 0);
  const burn = points.length ? `
      <div class="burn">${points.map(p => {
        const value = Number(p.total_cost_usd) || 0;
        const height = max > 0 ? Math.max(2, Math.round((value / max) * 56)) : 2;
        return `<div class="bar ${value > 0 ? "" : "empty"}" style="height:${height}px" title="${esc(p.bucket)}: ${money(value)}"></div>`;
      }).join("")}</div>
      <div class="muted">burn ${money(series.burn_usd_per_day)}/day · ${money(series.burn_usd_per_week)}/week · ${esc(series.bucket)}</div>` : "";

  return `<h2>Cost</h2><div class="cost">${kpis}</div>${hint}${table}${burn}`;
}

function setStatus(value) { currentStatus = value; loadDetail(); }

async function selectProject(slug) {
  current = slug;
  renderProjects($("filter") ? $("filter").value : "");
  await loadDetail();
}

async function loadDetail() {
  if (!current) return;
  const slug = current;
  try {
    const page = currentStatus
      ? `?status=${encodeURIComponent(currentStatus)}&limit=200`
      : "?limit=200";
    const [status, items, claims, docs, summary, series, rows] = await Promise.all([
      api(`/api/projects/${slug}/status`),
      api(`/api/projects/${slug}/items${page}`),
      api(`/api/projects/${slug}/claims`),
      api(`/api/projects/${slug}/documents`),
      api(`/api/economics/summary?project=${encodeURIComponent(slug)}`).catch(() => null),
      api(`/api/economics/series?project=${encodeURIComponent(slug)}&bucket=day`).catch(() => null),
      api(`/api/economics?project=${encodeURIComponent(slug)}&group_by=model`).catch(() => []),
    ]);
    const f = status.forecast || {};
    const p = status.progress || {};
    const options = STATUSES.map(
      s => `<option value="${s}" ${s === currentStatus ? "selected" : ""}>${s || "all statuses"}</option>`
    ).join("");
    $("detail").innerHTML = `
      <h2>${slug}</h2>
      <div>${Object.entries(status.by_status || {}).map(([k, v]) => `<span class="pill">${k} ${v}</span>`).join("")}</div>
      <h2>Progress</h2>
      <div class="muted">CPI ${p.cpi ?? "—"} · SPI ${p.spi ?? "—"} · EAC ${p.eac_hours ?? "—"}h · forecast p50 ${f.p50 ?? "—"} / p90 ${f.p90 ?? "—"} days</div>
      ${renderCost(summary, series, rows)}
      <h2>Items (${items.length})</h2>
      <div style="margin-bottom:8px"><select onchange="setStatus(this.value)">${options}</select></div>
      <table><tr><th>status</th><th>p</th><th>title</th><th>estimate</th></tr>
      ${items.map(i => `<tr><td>${i.status}</td><td>${i.priority}</td><td>${i.title}</td><td>${i.estimate_hours ?? "—"}</td></tr>`).join("")}</table>
      <h2>Active claims (${claims.length})</h2>
      <div>${claims.map(c => `<span class="pill">${(c.agent || {}).name || c.agent_id} → ${(c.item || {}).title || c.work_item_id}</span>`).join("") || '<span class="muted">none</span>'}</div>
      <h2>Documents (${docs.length})</h2>
      <div>${docs.map(d => `<span class="pill">${d.type}/${d.slug} v${d.version}</span>`).join("") || '<span class="muted">none</span>'}</div>
    `;
  } catch (e) { $("detail").innerHTML = `<p class="bad">${e.message}</p>`; }
}

refresh();
setInterval(refresh, 15000);
</script>
</body>
</html>
