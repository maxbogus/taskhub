[project]
name = "taskhub-mcp"
version = "0.2.0"
description = "Local MCP-native single source of truth for tasks, projects and metrics"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "maxbogus" }]
keywords = ["mcp", "task-management", "backlog", "metrics", "sqlite"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Bug Tracking",
]

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0.30",
    "aiosqlite>=0.20",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "mcp>=1.0,<2",
    "numpy>=1.26,<2.0",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "structlog>=24.1",
    "prometheus-client>=0.20",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.1",
    "ruff==0.17.5",
    "mypy==2.4.1",
    "types-PyYAML>=6.0",
]

[project.scripts]
taskhub-mcp = "taskhub.mcp.server:run"
taskhub-web = "taskhub.api.main:run"
taskhub = "taskhub.cli:main"

[project.urls]
Homepage = "https://github.com/maxbogus/taskhub"
Issues = "https://github.com/maxbogus/taskhub/issues"
Changelog = "https://github.com/maxbogus/taskhub/blob/main/CHANGELOG.md"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/taskhub"]

[tool.hatch.build.targets.sdist]
# The tests make the release gates meaningful for anyone rebuilding from the
# sdist; the eval cases document the MCP contract.
include = [
    "/src",
    "/tests",
    "/eval",
    "/alembic",
    "/scripts",
    "/alembic.ini",
    "/pyproject.toml",
    "/README.md",
    "/CHANGELOG.md",
    "/LICENSE",
    "/Makefile",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
mypy_path = "src"
files = ["src/taskhub", "scripts"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["src"]
# Маркеры eval-слоёв: `mock` — детерминированный replay (всегда зелёный,
# идёт в CI), `slow` — прогон с живой моделью (вне CI).
markers = [
    "mock: deterministic replay without a model (CI-safe)",
    "slow: runs a live model (not in CI)",
]
